<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polls · Studio Hibari</title>
  <link rel="icon" type="image/png" href="/images/logo/sh_studiohibari_logo_small_stroke.png" />
  <meta name="robots" content="noindex" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script>
    // Apply stored theme before paint to avoid a flash
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="/polls/polls.css" />
</head>
<body>
  <header class="container topbar">
    <a href="/" class="topbar__logo" aria-label="Studio Hibari home">
      <img src="/images/logo/sh_studiohibari_logo_small.png" alt="" />
      Studio Hibari
    </a>
    <div class="nav__actions">
      <button class="nav__lang-toggle" id="langToggle" aria-label="Switch language">DE</button>
      <button class="nav__theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
        <!-- moon = dark mode is active -->
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6 6 0 1 0 8 8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- sun = light mode is active -->
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="polls">
    <div class="container">
      <div class="polls__header reveal">
        <h1 class="page-title">Polls<span>.</span></h1>
        <p class="polls__sub" data-i18n="sub">Small decisions, crowdsourced. Pick a poll, have a look, tell me what you think.</p>
      </div>

      <div class="polls__grid" id="pollsGrid"></div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <p class="footer__text">
        © 2026 · built with <span>claude code</span> · hibari.studio
      </p>
      <div class="footer__logo">
        <img class="logo-dark"  src="/images/logo/studiohibari_logo_small_white.png" alt="Studio Hibari" />
        <img class="logo-light" src="/images/logo/studiohibari_logo_small_black.png" alt="Studio Hibari" />
      </div>
    </div>
  </footer>

  <script src="/polls/polls.js"></script>
</body>
</html>
